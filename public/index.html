<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORENSIQ | AI Token Forensics</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="assets/logo-mark.png" alt="FORENSIQ logo">
    <div class="brand-text">
      <h1>FORENSIQ</h1>
      <p class="tag">AI TOKEN FORENSICS</p>
    </div>
  </div>
  <form id="scan-form" autocomplete="off">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="address" type="text" placeholder="Enter contract address, token name, or paste address..." required spellcheck="false">
      <select id="chain" class="hidden" aria-hidden="true">
        <option value="robinhood" selected>robinhood</option>
      </select>
      <button id="scan-btn" type="submit">SCAN</button>
    </div>
    <details id="more">
      <summary>more options</summary>
      <div class="row extra">
        <input id="github" type="text" placeholder="github org or repo URL (optional)" spellcheck="false">
        <input id="site" type="text" placeholder="project website (optional)" spellcheck="false">
        <input id="twitter" type="text" placeholder="twitter handle (optional)" spellcheck="false">
      </div>
    </details>
  </form>
  <span class="chain-badge">ROBINHOOD CHAIN</span>
</header>

<main>
  <div id="loading" class="hidden panel">
    <div class="spinner"></div>
    <p>ANALYZING<span id="dots"></span> <small>10 to 30 seconds</small></p>
  </div>

  <div id="error" class="hidden"></div>

  <section id="result" class="hidden">
    <div id="verdict" class="panel verdict-panel">
      <div class="panel-tab">AI AGENT VERDICT</div>
      <div class="verdict-body">
        <div class="verdict-main">
          <div id="verdict-line"></div>
          <p id="verdict-sub"></p>
          <p id="summary"></p>
        </div>
        <div class="confidence">
          <span class="conf-label">CONFIDENCE SCORE</span>
          <div class="conf-track"><div id="conf-fill"></div></div>
          <span id="conf-num"></span>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-head">PLAIN ENGLISH BREAKDOWN</div>
        <div id="breakdown"></div>
      </div>
      <div class="col">
        <div class="panel chart-panel">
          <div class="panel-head">PRICE CHART</div>
          <div id="chart-wrap"><p class="dim">no pair data</p></div>
        </div>
        <div class="panel">
          <div class="panel-head">CONTRACT &amp; HONEYPOT CHECK</div>
          <div id="honeypot"></div>
        </div>
      </div>
    </div>

    <div id="statbar" class="panel statbar hidden"></div>

    <div class="panel">
      <div class="panel-head">FULL SCAN LOG</div>
      <div id="sections"></div>
    </div>
  </section>

  <section id="history-wrap" class="panel">
    <div class="panel-head">RECENT SCANS</div>
    <ul id="history"></ul>
  </section>
</main>

<footer>FORENSIQ v1 · rule engine + AI analysis · not financial advice</footer>
<script src="app.js"></script>
</body>
</html>
